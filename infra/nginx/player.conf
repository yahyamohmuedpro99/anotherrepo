# Player: tiny shell, hashed assets cached forever, packs immutable by content hash, API and rooms proxied.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types application/javascript application/json text/css image/svg+xml application/manifest+json;
  gzip_min_length 1024;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
  }

  location /packs/ {
    alias /usr/share/nginx/packs/;
    add_header Cache-Control "no-cache" always;
    location ~ /bundle\.[0-9a-f]+\.json$ {
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location ~ /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
  }

  # Resolve upstreams per request via Docker's DNS so nginx starts before api/rooms are up.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:4000;
  set $rooms_upstream http://rooms:2567;

  location = /sw.js { add_header Cache-Control "no-cache" always; }

  # API (events, code resolution, class join) and the printed short links
  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 2m;
  }
  location /s/ {
    proxy_pass $api_upstream;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # live class sessions (Colyseus: HTTP matchmaking + WebSocket)
  location /rooms/ {
    rewrite ^/rooms/(.*)$ /$1 break;
    proxy_pass $rooms_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
  }

  location / {
    try_files $uri /index.html;
  }
}
