<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0c1530" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' ws: wss:; media-src 'self' data: blob:; script-src 'self'; worker-src 'self'" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>رحلة · Rihla</title>
    <style>
      html,body{margin:0;height:100%;background:#0c1530;color:#f6ead0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;overflow:hidden}
      #app{position:fixed;inset:0}
      .shell{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px;background:radial-gradient(circle at 50% 30%,#1d2c5c,#0c1530 70%)}
      .shell h1{font-size:clamp(34px,9vw,60px);margin:0;color:#f6d58a;line-height:1.1}
      .shell p{margin:10px 0 0;opacity:.85;font-size:15px}
      .shell .bar{width:min(240px,70vw);height:6px;border-radius:999px;background:rgba(244,231,201,.14);margin:18px auto 0;overflow:hidden}
      .shell .bar i{display:block;height:100%;width:30%;background:linear-gradient(90deg,#33b7a9,#e9b44c);animation:slide 1.2s ease-in-out infinite alternate}
      @keyframes slide{from{transform:translateX(-60%)}to{transform:translateX(260%)}}
      @media (prefers-reduced-motion:reduce){.shell .bar i{animation:none;width:60%}}
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="shell" id="shell" role="status"><div><h1 id="shell-title">رحلة</h1><p id="shell-sub">بنجهّز الرحلة… · Getting your trip ready…</p><div class="bar"><i></i></div></div></div>
    <noscript>رحلة محتاجة JavaScript. · Rihla needs JavaScript.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
